[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moorcheh"
version = "0.1.0"
description = "Moorcheh client and runtime launcher for on-prem server containers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
web = [
  "Flask>=3.0.0",
]

[project.scripts]
moorcheh = "moorcheh.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["moorcheh*"]

[tool.setuptools.package-data]
moorcheh = ["compose/docker-compose.yml"]
