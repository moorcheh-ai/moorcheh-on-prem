name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must start with v, e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag must look like v0.1.0 (got: $TAG)"
            exit 1
          fi
          pip install setuptools-scm
          VERSION=$(python -c "import setuptools_scm; print(setuptools_scm.get_version())")
          EXPECTED="${TAG#v}"
          echo "Tag: $TAG -> version $EXPECTED (setuptools-scm: $VERSION)"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Version from git does not match tag. Checkout the tagged commit and push the tag first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
