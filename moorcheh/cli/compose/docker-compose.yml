services:
  ollama:
    profiles: ["bundled-ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: moorcheh-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  server:
    image: ${MOORCHEH_SERVER_IMAGE:-moorcheh/server:latest}
    container_name: moorcheh-onprem-server
    depends_on:
      ollama:
        condition: service_started
        required: false
    ports:
      - "${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mxbai-embed-large}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mxbai-embed-large}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      DATA_FILE: /app/data/moorcheh_data_store.json
      NAMESPACE_REGISTRY_FILE: /app/data/namespace_registry.json
      FILE_REGISTRY_FILE: /app/data/file_registry.json
      ALLOWED_UPLOAD_PATHS: /uploads
      CHUNKER_URL: http://127.0.0.1:8090
    volumes:
      - ${MOORCHEH_DATA_DIR}:/app/data
      - ${MOORCHEH_UPLOAD_DIR}:/uploads:ro

volumes:
  ollama_data:
